<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">MONIKA AI — Double M</title>
<desc id="desc">A bold, connected double-M monogram with a clean cyan-to-violet gradient on a transparent background.</desc>
<defs>
  <linearGradient id="face" x1="50" y1="90" x2="350" y2="310" gradientUnits="userSpaceOnUse">
    <stop stop-color="#68E8E5"/>
    <stop offset=".5" stop-color="#6D91FF"/>
    <stop offset="1" stop-color="#B477F5"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#263A82" stop-opacity=".7"/>
    <stop offset="1" stop-color="#111A45" stop-opacity=".15"/>
  </linearGradient>
</defs>
<g class="double-m">
  <g class="left-m">
    <path class="depth" d="M54 302 V112 L128 230 L202 112 V302" transform="translate(0 9)"/>
    <path class="face-line" d="M54 302 V112 L128 230 L202 112 V302"/>
  </g>
  <g class="right-m">
    <path class="depth" d="M198 302 V112 L272 230 L346 112 V302" transform="translate(0 9)"/>
    <path class="face-line" d="M198 302 V112 L272 230 L346 112 V302"/>
  </g>
</g>
<style>
  .face-line,.depth{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .depth{stroke:url(#edge);stroke-width:31}
  .face-line{stroke:url(#face);stroke-width:27}
  .double-m{transform-box:fill-box;transform-origin:center;animation:turn 8s ease-in-out infinite}
  .left-m,.right-m{transform-box:fill-box;transform-origin:center;animation:separate 7s cubic-bezier(.65,0,.25,1) infinite}
  .right-m{animation-name:separate-right}
  @keyframes turn{
    0%,18%,82%,100%{transform:perspective(800px) rotateY(0) scale(1)}
    40%,60%{transform:perspective(800px) rotateY(10deg) scale(1.025)}
    50%{transform:perspective(800px) rotateY(0) scale(1.04)}
  }
  @keyframes separate{
    0%,25%,78%,100%{transform:translate(0,0) rotate(0)}
    40%,60%{transform:translate(-13px,-8px) rotate(-4deg)}
    50%{transform:translate(-21px,-12px) rotate(-7deg)}
  }
  @keyframes separate-right{
    0%,25%,78%,100%{transform:translate(0,0) rotate(0)}
    40%,60%{transform:translate(13px,8px) rotate(4deg)}
    50%{transform:translate(21px,12px) rotate(7deg)}
  }
  @media(prefers-reduced-motion:reduce){.double-m,.left-m,.right-m{animation:none}}
</style>
</svg>