<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">MONIKA AI — Single Crossing M</title>
<desc id="desc">One bold capital M with a central crossing stroke, cyan-to-violet gradient, transparent background.</desc>
<defs>
 <linearGradient id="m-gradient" x1="60" y1="80" x2="340" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#70E5E4"/><stop offset=".52" stop-color="#638EFF"/><stop offset="1" stop-color="#A875F5"/></linearGradient>
 <filter id="depth" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset dy="7" result="offset"/><feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g class="single-m" fill="none" stroke="url(#m-gradient)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" filter="url(#depth)">
 <path d="M76 312 V88 L324 312 V88"/>
 <path class="cross-stroke" d="M76 88 L324 312" stroke-width="23" stroke="#8CCBFF"/>
</g>
<style>
.single-m{transform-box:fill-box;transform-origin:center;animation:turn 7s ease-in-out infinite}
.cross-stroke{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 7s ease-in-out infinite}
@keyframes turn{0%,18%,82%,100%{transform:perspective(700px) rotateY(0) scale(1)}38%,62%{transform:perspective(700px) rotateY(12deg) scale(1.025)}50%{transform:perspective(700px) rotateY(0) scale(1.04)}}
@keyframes draw{0%,20%,80%,100%{stroke-dashoffset:420;opacity:.35}38%,62%{stroke-dashoffset:0;opacity:1}50%{stroke-dashoffset:0;opacity:1}}
@media(prefers-reduced-motion:reduce){.single-m,.cross-stroke{animation:none;stroke-dashoffset:0}}
</style>
</svg>