<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">MONIKA AI — Premium 3D M</title>
<desc id="desc">A single bold capital M monogram with sculpted metallic bevels, a luminous crossing detail, full rotation and a four-part breakdown animation.</desc>
<defs>
 <linearGradient id="metal" x1="65" y1="55" x2="335" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#D8FFFF"/><stop offset=".2" stop-color="#68E5E2"/><stop offset=".52" stop-color="#6D9DFF"/><stop offset=".78" stop-color="#9470FF"/><stop offset="1" stop-color="#E0A0FF"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253A9B"/><stop offset=".5" stop-color="#26306D"/><stop offset="1" stop-color="#512A91"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
 <radialGradient id="gem"><stop stop-color="#FFFFFF"/><stop offset=".28" stop-color="#B8FFFF"/><stop offset="1" stop-color="#7C6BFF"/></radialGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/><feOffset dy="13" result="o"/><feColorMatrix in="o" type="matrix" values="0 0 0 0 .02 0 0 0 0 .04 0 0 0 0 .2 0 0 0 .8 0" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Thin orbit accents frame the mark without becoming a second letter. -->
<g class="orbit" fill="none" stroke="#8BBEFF" opacity=".36">
 <path d="M55 118 A160 160 0 0 1 345 118" stroke-width="1.5" stroke-dasharray="3 11"/>
 <path d="M55 282 A160 160 0 0 0 345 282" stroke-width="1.5" stroke-dasharray="3 11"/>
 <circle cx="55" cy="118" r="4" fill="#79E8E8" stroke="none"/><circle cx="345" cy="282" r="4" fill="#B18BFF" stroke="none"/>
</g>
<g class="turn" filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <g class="part part-left">
  <path class="extrude" d="M82 306 V91"/>
  <path class="main" d="M82 306 V91"/>
  <path class="shine" d="M78 292 V105"/>
 </g>
 <g class="part part-down">
  <path class="extrude" d="M82 91 L200 211"/>
  <path class="main" d="M82 91 L200 211"/>
  <path class="shine" d="M91 99 L194 204"/>
 </g>
 <g class="part part-up">
  <path class="extrude" d="M200 211 L318 91"/>
  <path class="main" d="M200 211 L318 91"/>
  <path class="shine" d="M207 202 L309 99"/>
 </g>
 <g class="part part-right">
  <path class="extrude" d="M318 91 V306"/>
  <path class="main" d="M318 91 V306"/>
  <path class="shine" d="M322 105 V292"/>
 </g>
 <!-- Small interwoven luminous clasp makes the central crossing intentional. -->
 <g class="clasp" filter="url(#glow)">
  <path d="M181 192 Q200 177 219 196 L229 207 Q200 235 171 207 Z" fill="#34499F" opacity=".95"/>
  <path d="M183 194 Q200 181 217 197 L224 205 Q200 225 176 205 Z" fill="url(#gem)" stroke="#DDFEFF" stroke-width="2"/>
  <path d="M188 198 Q200 190 212 199" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".85"/>
 </g>
</g>
<style>
 .extrude{stroke:url(#side);stroke-width:43;transform:translate(0px,10px)}
 .main{stroke:url(#metal);stroke-width:33}
 .shine{stroke:url(#edge);stroke-width:5;opacity:.8}
 .part{transform-box:fill-box;transform-origin:center}
 .turn{transform-box:fill-box;transform-origin:center;animation:turn360 9s cubic-bezier(.45,0,.55,1) infinite}
 .orbit{transform-origin:200px 200px;animation:orbitPulse 9s ease-in-out infinite}
 .clasp{transform-origin:200px 205px;animation:claspPulse 9s ease-in-out infinite}
 .part-left{animation:pieceL 9s ease-in-out infinite}
 .part-down{animation:pieceD 9s ease-in-out infinite}
 .part-up{animation:pieceU 9s ease-in-out infinite}
 .part-right{animation:pieceR 9s ease-in-out infinite}
 @keyframes turn360{0%,18%{transform:perspective(1000px) rotateY(0) rotateX(0) scale(1)}48%{transform:perspective(1000px) rotateY(180deg) rotateX(10deg) scale(1.04)}72%,100%{transform:perspective(1000px) rotateY(360deg) rotateX(0) scale(1)}}
 @keyframes pieceL{0%,8%{transform:translate(-34px,-20px) rotate(-8deg);opacity:0}18%,70%{transform:none;opacity:1}82%,91%{transform:translate(-34px,-20px) rotate(-8deg);opacity:0}100%{transform:translate(-34px,-20px);opacity:0}}
 @keyframes pieceD{0%,11%{transform:translate(-20px,26px) rotate(-7deg);opacity:0}22%,70%{transform:none;opacity:1}82%,91%{transform:translate(-20px,26px) rotate(-7deg);opacity:0}100%{transform:translate(-20px,26px);opacity:0}}
 @keyframes pieceU{0%,14%{transform:translate(20px,26px) rotate(7deg);opacity:0}26%,70%{transform:none;opacity:1}82%,91%{transform:translate(20px,26px) rotate(7deg);opacity:0}100%{transform:translate(20px,26px);opacity:0}}
 @keyframes pieceR{0%,17%{transform:translate(34px,-20px) rotate(8deg);opacity:0}30%,70%{transform:none;opacity:1}82%,91%{transform:translate(34px,-20px) rotate(8deg);opacity:0}100%{transform:translate(34px,-20px);opacity:0}}
 @keyframes claspPulse{0%,25%,70%,100%{opacity:1;transform:scale(1)}48%{opacity:.75;transform:scale(1.12)}84%,92%{opacity:0;transform:scale(.6)}}
 @keyframes orbitPulse{0%,100%{opacity:.25}45%,65%{opacity:.65}}
 @media(prefers-reduced-motion:reduce){.turn,.orbit,.clasp,.part{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</svg>