<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">MONIKA AI — Interwoven M</title>
<desc id="desc">A minimal angular interwoven M monogram inspired by two continuous geometric ribbons, cyan fading through blue to violet, on a transparent canvas.</desc>
<defs>
 <linearGradient id="ribbon" x1="65" y1="200" x2="335" y2="200" gradientUnits="userSpaceOnUse"><stop stop-color="#08D8E8"/><stop offset=".48" stop-color="#448DDB"/><stop offset="1" stop-color="#9638D9"/></linearGradient>
 <filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g fill="none" stroke="url(#ribbon)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
 <path d="M54 300 L112 105 L180 105 L250 300 L320 105 L388 105 L346 300 L278 300 L208 105 L138 300 Z"/>
 <path d="M112 105 L180 105 L208 205 L236 105 L304 105" opacity=".92"/>
</g>
<style>
g{transform-origin:200px 200px;animation:calmGlow 3.6s ease-in-out infinite}
@keyframes calmGlow{0%,100%{opacity:.92;transform:scale(1)}50%{opacity:1;transform:scale(1.012)}}
@media(prefers-reduced-motion:reduce){g{animation:none}}
</style>
</svg>