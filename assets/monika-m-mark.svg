<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">MONIKA AI angular neon 3D monogram</title>
<desc id="desc">A bold angular M containing a clear A and I, with layered neon bevels, deep extrusion, 360 degree rotation and separated assembly animation.</desc>
<defs>
 <linearGradient id="m" x1="55" y1="60" x2="350" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#4CF5E7"/><stop offset=".28" stop-color="#35C8FF"/><stop offset=".58" stop-color="#687AFF"/><stop offset=".82" stop-color="#A44FFF"/><stop offset="1" stop-color="#D17BFF"/></linearGradient>
 <linearGradient id="a" x1="135" y1="150" x2="260" y2="315" gradientUnits="userSpaceOnUse"><stop stop-color="#B6FFFF"/><stop offset=".5" stop-color="#61CFFF"/><stop offset="1" stop-color="#8D70FF"/></linearGradient>
 <linearGradient id="i" x1="280" y1="165" x2="315" y2="310" gradientUnits="userSpaceOnUse"><stop stop-color="#5CF5E4"/><stop offset=".55" stop-color="#54BFFF"/><stop offset="1" stop-color="#A86BFF"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></linearGradient>
 <filter id="depth" x="-40%" y="-40%" width="180%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/><feOffset dy="13" result="o"/><feColorMatrix in="o" type="matrix" values="0 0 0 0 .01 0 0 0 0 .02 0 0 0 0 .2 0 0 0 .9 0" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g class="orbit" fill="none" stroke="#72DFFF" opacity=".4"><path d="M42 116 A168 168 0 0 1 358 116 M42 284 A168 168 0 0 0 358 284" stroke-width="1.5" stroke-dasharray="2 10"/><circle cx="42" cy="116" r="4" fill="#42E9E4" stroke="none"/><circle cx="358" cy="284" r="4" fill="#B477FF" stroke="none"/></g>
<g class="spin" filter="url(#depth)">
 <g class="piece m-piece" fill="none" stroke-linejoin="bevel" stroke-linecap="butt">
  <path d="M66 320 V67 L200 205 L334 67 V320" stroke="#24266F" stroke-width="40" transform="translate(0 11)"/>
  <path d="M66 320 V67 L200 205 L334 67 V320" stroke="url(#m)" stroke-width="29"/>
  <path d="M61 306 V80 L200 222 L339 80 V306" stroke="url(#shine)" stroke-width="4" opacity=".8"/>
  <path d="M80 303 V104 M200 218 L319 96 M319 303 V104" stroke="#E5FFFF" stroke-width="2" opacity=".48"/>
 </g>
 <g class="piece a-piece" fill="none" stroke-linejoin="bevel" stroke-linecap="butt" filter="url(#glow)">
  <path d="M125 299 L190 158 L255 299" stroke="#25266F" stroke-width="26" transform="translate(0 8)"/>
  <path d="M125 299 L190 158 L255 299" stroke="url(#a)" stroke-width="17"/>
  <path d="M139 287 L190 178 L241 287" stroke="#E9FFFF" stroke-width="3" opacity=".8"/>
  <path d="M151 252 H229" stroke="#25266F" stroke-width="18" transform="translate(0 7)"/>
  <path d="M151 252 H229" stroke="url(#a)" stroke-width="11"/>
  <path d="M154 248 H226" stroke="#FFF" stroke-width="2.5"/>
 </g>
 <g class="piece i-piece" fill="none" stroke-linecap="butt" filter="url(#glow)">
  <path d="M296 213 V300" stroke="#25266F" stroke-width="25" transform="translate(0 8)"/>
  <path d="M296 213 V300" stroke="url(#i)" stroke-width="16"/>
  <path d="M292 220 V291" stroke="#FFF" stroke-width="2.5" opacity=".85"/>
  <circle cx="296" cy="174" r="18" fill="#25266F" stroke="none" transform="translate(0 8)"/>
  <circle cx="296" cy="174" r="14" fill="url(#i)" stroke="#C8FFFF" stroke-width="3"/>
  <circle cx="292" cy="169" r="4" fill="#FFF" opacity=".8"/>
 </g>
 <path class="connector" d="M181 203 L200 222 L219 203" fill="none" stroke="#E9FFFF" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
</g>
<style>
.spin{transform-box:fill-box;transform-origin:center;animation:turn 9s cubic-bezier(.45,0,.55,1) infinite}
.piece{transform-box:fill-box;transform-origin:center}
.m-piece{animation:bm 9s ease-in-out infinite}.a-piece{animation:ba 9s ease-in-out infinite}.i-piece{animation:bi 9s ease-in-out infinite}
.connector{animation:co 9s ease-in-out infinite}.orbit{animation:or 9s ease-in-out infinite;transform-origin:200px 200px}
@keyframes turn{0%,18%{transform:perspective(1100px) rotateY(0) rotateX(0) scale(1)}48%{transform:perspective(1100px) rotateY(180deg) rotateX(9deg) scale(1.04)}72%,100%{transform:perspective(1100px) rotateY(360deg) rotateX(0) scale(1)}}
@keyframes bm{0%,7%{opacity:0;transform:translateY(-30px) scale(.9)}18%,72%{opacity:1;transform:none}83%,92%,100%{opacity:0;transform:translateY(-30px) scale(.9)}}
@keyframes ba{0%,13%{opacity:0;transform:translate(-24px,32px) rotate(-9deg) scale(.82)}24%,72%{opacity:1;transform:none}83%,92%,100%{opacity:0;transform:translate(-24px,32px) rotate(-9deg) scale(.82)}}
@keyframes bi{0%,19%{opacity:0;transform:translate(28px,24px) rotate(8deg) scale(.82)}30%,72%{opacity:1;transform:none}83%,92%,100%{opacity:0;transform:translate(28px,24px) rotate(8deg) scale(.82)}}
@keyframes co{0%,26%,72%,100%{opacity:1}45%{opacity:.4}84%,92%{opacity:0}}
@keyframes or{0%,100%{opacity:.2}45%,65%{opacity:.65}}
@media(prefers-reduced-motion:reduce){.spin,.piece,.connector,.orbit{animation:none!important;opacity:1!important;transform:none!important}}
</style></svg>