<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">MONIKA AI — Prism Orbit emblem</title>
<desc id="desc">A unique luminous interlocking orbital M mark in violet, electric blue and cyan, with separated animated ribbon segments. The canvas is fully transparent.</desc>
<defs>
 <linearGradient id="ribbon" x1="70" y1="80" x2="430" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#F4DFFF"/><stop offset=".22" stop-color="#B78BFF"/><stop offset=".52" stop-color="#7554FF"/><stop offset=".78" stop-color="#398DFF"/><stop offset="1" stop-color="#69F2ED"/></linearGradient>
 <linearGradient id="edge" x1="90" y1="120" x2="420" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#5A31B8"/><stop offset=".55" stop-color="#283FAD"/><stop offset="1" stop-color="#087E9B"/></linearGradient>
 <linearGradient id="core" x1="205" y1="180" x2="320" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#F7E9FF"/><stop offset=".5" stop-color="#9A70FF"/><stop offset="1" stop-color="#54E9EF"/></linearGradient>
 <filter id="aura" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<!-- Independent glow particles; no background plate or bounding box -->
<g fill="#77EFFF" filter="url(#aura)">
 <circle cx="92" cy="164" r="6"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="421" cy="139" r="5"><animate attributeName="opacity" values="1;.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
 <circle cx="390" cy="391" r="4"><animate attributeName="opacity" values=".2;.9;.2" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<g class="orbit" transform-origin="256px 256px">
 <!-- rear depth strokes -->
 <g class="wing wing-left">
  <path d="M111 365 151 137Q155 116 174 132L256 210 228 245 181 201 151 373Z" fill="none" stroke="url(#edge)" stroke-width="39" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 12)"/>
  <path d="M111 365 151 137Q155 116 174 132L256 210 228 245 181 201 151 373Z" fill="none" stroke="url(#ribbon)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round" filter="url(#aura)"/>
 </g>
 <g class="wing wing-right">
  <path d="m256 210 82-78q19-17 23 8l40 225h-43l-29-172-48 46Z" fill="none" stroke="url(#edge)" stroke-width="39" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 12)"/>
  <path d="m256 210 82-78q19-17 23 8l40 225h-43l-29-172-48 46Z" fill="none" stroke="url(#ribbon)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round" filter="url(#aura)"/>
 </g>
 <g class="core">
  <path d="m207 263 48-48 49 48-49 51Z" fill="url(#edge)" transform="translate(0 10)"/>
  <path d="m207 253 48-48 49 48-49 51Z" fill="url(#core)" stroke="#EADFFF" stroke-width="4" stroke-linejoin="round" filter="url(#aura)"/>
  <path d="m225 253 30-30 31 30-31 31Z" fill="none" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="2"/>
 </g>
</g>
<path d="M143 410Q256 453 369 410" fill="none" stroke="#35DDEB" stroke-width="5" stroke-linecap="round" opacity=".75" filter="url(#aura)"/>
<style>
.orbit{animation:orbitTurn 9s cubic-bezier(.45,0,.55,1) infinite;transform-style:preserve-3d}
.wing,.core{transform-box:fill-box;transform-origin:center;animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.4,0,.2,1)}
.wing-left{animation-name:breakLeft}.wing-right{animation-name:breakRight}.core{animation-name:breakCore}
@keyframes orbitTurn{0%,18%{transform:perspective(900px) rotateY(0deg) rotateX(-4deg)}32%,68%{transform:perspective(900px) rotateY(180deg) rotateX(7deg) scale(.96)}84%,100%{transform:perspective(900px) rotateY(360deg) rotateX(-4deg)}}
@keyframes breakLeft{0%,24%,80%,100%{transform:translate(0,0)}42%,64%{transform:translate(-30px,-20px) rotate(-8deg)}}
@keyframes breakRight{0%,24%,80%,100%{transform:translate(0,0)}42%,64%{transform:translate(30px,-20px) rotate(8deg)}}
@keyframes breakCore{0%,24%,80%,100%{transform:translate(0,0) scale(1)}42%,64%{transform:translate(0,25px) scale(.88)}}
@media(prefers-reduced-motion:reduce){.orbit,.wing,.core{animation:none}}
</style>
</svg>