<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
<title id="title">MONIKA AI animated 3D M emblem</title><desc id="desc">Metallic violet and cyan M rotates, separates into floating pieces, and assembles again.</desc>
<defs>
<linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4E9FF"/><stop offset=".22" stop-color="#B88BFF"/><stop offset=".58" stop-color="#7545E8"/><stop offset="1" stop-color="#28DCEB"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34206F"/><stop offset=".55" stop-color="#5B35B5"/><stop offset="1" stop-color="#087F99"/></linearGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="90" cy="145" rx="49" ry="10" fill="#6D55FF" opacity=".24"/>
<g class="spin" transform-origin="90px 88px">
<g class="piece left"><path d="M35 122 46 46Q48 32 60 43L87 69 77 85 61 70 52 124Z" fill="url(#side)" transform="translate(0 7)"/><path d="M35 122 46 46Q48 32 60 43L87 69 77 85 61 70 52 124Z" fill="url(#front)" stroke="#E5D5FF" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)"/></g>
<g class="piece middle"><path d="M70 84 88 66 108 85 96 101 88 93 81 101Z" fill="url(#side)" transform="translate(0 7)"/><path d="M70 84 88 66 108 85 96 101 88 93 81 101Z" fill="url(#front)" stroke="#E5D5FF" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)"/></g>
<g class="piece right"><path d="m93 69 27-26q12-11 14 3l11 76h-18l-8-54-16 17Z" fill="url(#side)" transform="translate(0 7)"/><path d="m93 69 27-26q12-11 14 3l11 76h-18l-8-54-16 17Z" fill="url(#front)" stroke="#D4F9FF" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)"/></g>
<path d="M45 133Q90 149 139 130" fill="none" stroke="#27D9E8" stroke-width="2" stroke-linecap="round" opacity=".8"/>
</g>
<g fill="#8EEFFF" filter="url(#glow)"><circle cx="27" cy="62" r="2.8"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="151" cy="47" r="2.4"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="145" cy="132" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle></g>
<style>
.spin{animation:turn 8s cubic-bezier(.45,0,.55,1) infinite;transform-style:preserve-3d}
.piece{transform-box:fill-box;transform-origin:center;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.4,0,.2,1)}
.left{animation-name:splitL}.middle{animation-name:splitM}.right{animation-name:splitR}
@keyframes turn{0%,18%{transform:perspective(650px) rotateY(0deg) rotateX(-5deg) scale(1)}30%,68%{transform:perspective(650px) rotateY(180deg) rotateX(8deg) scale(.94)}82%,100%{transform:perspective(650px) rotateY(360deg) rotateX(-5deg) scale(1)}}
@keyframes splitL{0%,25%,78%,100%{transform:translate3d(0,0,0)}42%,62%{transform:translate3d(-23px,-15px,35px) rotate(-13deg)}}
@keyframes splitM{0%,25%,78%,100%{transform:translate3d(0,0,0)}42%,62%{transform:translate3d(0,-25px,48px) rotate(7deg)}}
@keyframes splitR{0%,25%,78%,100%{transform:translate3d(0,0,0)}42%,62%{transform:translate3d(23px,-13px,35px) rotate(13deg)}}
@media(prefers-reduced-motion:reduce){.spin,.piece{animation:none}}
</style></svg>