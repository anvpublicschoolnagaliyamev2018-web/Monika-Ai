      <stop offset="0" stop-color="#B58CFF"/>
      <stop offset=".48" stop-color="#8757F5"/>
      <stop offset="1" stop-color="#27D9E8"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
